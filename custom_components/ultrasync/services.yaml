# Describes the format for available ultrasync services

away:
  description: Set Alarm to Away
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: true
      selector:
        number:
          mode: box
          min: 1
          max: 8

stay:
  description: Set Alarm to Stay
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: true
      selector:
        number:
          mode: box
          min: 1
          max: 8

disarm:
  description: Set Alarm to Disarmed
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: true
      selector:
        number:
          mode: box
          min: 1
          max: 8

fire:
  description: Set Alarm to Fire Alarm
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: false
      selector:
        number:
          mode: box
          min: 1
          max: 8

medical:
  description: Set Alarm to Medical Alarm
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: false
      selector:
        number:
          mode: box
          min: 1
          max: 8

panic:
  description: Set Alarm to Panic Alarm
  fields:
    area:
      name: Area
      description: The partition/area to target (1, 2, etc.)
      required: false
      selector:
        number:
          mode: box
          min: 1
          max: 8

bypass:
  description: Bypass a zone
  fields:
    zone:
      name: Zone
      description: The zone to bypass
      required: true
      example: 1
      selector:
        number:
          mode: box
          min: 1
          max: 100

unbypass:
  description: Unbypass a zone
  fields:
    zone:
      name: Zone
      description: The zone to unbypass
      required: true
      example: 1
      selector:
        number:
          mode: box
          min: 1
          max: 100

switch:
  description: Switch an output control on or off.
  fields:
    output:
      name: Output
      description: The output control to switch.
      required: true
      example: 1
      selector:
        number:
          mode: box
          min: 1
          max: 100
    state:
      name: State
      description: The desired state for the output (0 for off, 1 for on).
      required: true
      example: 1
      selector:
        number:
          mode: box
          min: 0
          max: 1
